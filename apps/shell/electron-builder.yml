appId: com.freecode.deepseekharness
productName: FreeCode DeepSeek Harness
artifactName: FreeCode-DeepSeek-Harness-${version}-${os}-${arch}.${ext}
asar: true
compression: normal
beforePack: build/patch-nsis.cjs
directories:
  output: release
  buildResources: build
extraMetadata:
  main: dist/src/main/index.js
files:
  - dist/**/*
  - package.json
  - ../../packages/*/dist/**/*
  - ../../package.json
  - ../../node_modules/**/*
  - '!../../vendor/**'
  - '!tests/**'
  - '!../../packages/*/tests/**'
extraResources:
  - from: resources/freecode
    to: freecode
    filter:
      - '**/*'
      - '!.uv-cache/**'
      - '!.uv-cache'
      - '!.uv-tools/**'
      - '!.uv-tools'
icon: build/icon.png
win:
  icon: build/icon.ico
  sign: false
  target:
    - nsis
    - portable
nsis:
  artifactName: FreeCode-DeepSeek-Harness-${version}-${os}-${arch}-setup.${ext}
  oneClick: true
  shortcutName: FreeCode DeepSeek Harness
  createStartMenuShortcut: true
  createDesktopShortcut: always
  # NOTE: installer.nsh macros resolve without this option because
  # installSection.nsh does `!include installer.nsh` (found via the build
  # resources include dir). Keep this line commented: enabling nsis.include
  # would define every macro twice and break the makensis build.
portable:
  artifactName: FreeCode-DeepSeek-Harness-${version}-${os}-${arch}-portable.${ext}
publish:
  provider: github
  owner: Akunimal
  repo: free-code-deepseek-harness
