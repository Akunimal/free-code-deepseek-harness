# FreeCode-owned provider slice. scripts/phoenix-catalog.mjs appends it after the
# pinned FreeLLMpool slice, so vendor/freellmpool stays unmodified.
#
# Free.ai: keyless OpenAI-compatible endpoint, no Authorization header. Each model
# below returned a tool call in a live anonymous probe on 2026-10-23. The first
# two also passed three repeat completions. Free.ai publishes no native context
# windows. Per-IP quota can answer 429 for a while after a burst of probes.
[[provider]]
id = "freeai"
label = "Free.ai (keyless)"
adapter = "openai"
base_url = "https://api.free.ai/v1"
auth = "none"
models = [
    { name = "qwen3-coder", rpd = 0 },
    { name = "qwen-coder", rpd = 0 },
    { name = "qwen-vl", rpd = 0 },
    { name = "qwen7b", rpd = 0 },
    { name = "qwen25-vl", rpd = 0 },
    { name = "deepseek-r1", rpd = 0 },
    { name = "mistral", rpd = 0 },
    { name = "qwen3-8b", rpd = 0 },
]
