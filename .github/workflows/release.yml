name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install upstream workspace
        shell: bash
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile --node-linker=hoisted

      - name: Build opencode2api resources
        shell: bash
        run: bash scripts/build-opencode2api.sh

      - name: Link upstream runtime packages
        run: pnpm prepare:upstream

      - name: Build upstream harness
        shell: bash
        run: |
          pnpm --dir vendor/deepseek-harness exec tsc -b tsconfig.host.json --noCheck
          pnpm --dir vendor/deepseek-harness exec tsdown --env.DSH_BUILD_FACE host
          pnpm --dir vendor/deepseek-harness exec tsc -b tsconfig.client.json --noCheck
          pnpm --dir vendor/deepseek-harness exec tsdown --env.DSH_BUILD_FACE client
          pnpm --dir vendor/deepseek-harness run build:web

      - name: Run tests
        run: |
          pnpm test
          pnpm test:contract

      - name: Build desktop artifact
        run: pnpm build:desktop

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeCode-DeepSeek-Harness-${{ matrix.os }}
          path: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.blockmap
            apps/shell/release/*.dmg
            apps/shell/release/*.exe
            apps/shell/release/*.yml
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/**/*
